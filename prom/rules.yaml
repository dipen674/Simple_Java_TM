groups:
  # Alert group 1: Server status monitoring
  - name: server-status-alerts
    rules:
      # Alert when a server goes down
      - alert: ServerDown
        expr: up{job=~".*_VM|.*_registry"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Server {{ $labels.instance }} is down"
          description: "The server has been offline for 2 minutes. Please check the VM status."

      # Alert when a server comes back up
      - alert: ServerUp
        expr: up{job=~".*_VM|.*_registry"} == 1
        for: 0s
        labels:
          severity: info
        annotations:
          summary: "Server {{ $labels.instance }} is back online"
          description: "The server has recovered and is now accessible."

  # Alert group 2: Docker monitoring
  - name: docker-status-alerts
    rules:
      # Alert when Docker engine stops working
      - alert: DockerDown
        expr: up{job=~".*Docker_engine"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Docker on {{ $labels.instance }} is down"
          description: "Docker engine has been unavailable for 2 minutes."

      # Alert when cAdvisor stops working
      - alert: cAdvisorDown
        expr: up{job=~".*cAdvisor"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "cAdvisor on {{ $labels.instance }} is down"
          description: "Container monitoring has been unavailable for 2 minutes."

  # Alert group 3: Resource monitoring
  - name: resource-alerts
    rules:
      # Alert when CPU usage is too high
      - alert: HighCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 80% for 5 minutes."

      # Alert when memory is running low
      - alert: LowMemory
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low memory on {{ $labels.instance }}"
          description: "Available memory is below 20% for 5 minutes."
