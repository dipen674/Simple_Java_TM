---
- name: Get information about deependrabhatta/java_app images
  community.docker.docker_image_info:
    name: "deependrabhatta/java_app"
  register: deependra_images

- name: Remove all deependrabhatta/java_app images
  community.docker.docker_image:
    name: "deependrabhatta/java_app"
    state: absent
  when: deependra_images.images | length > 0
  ignore_errors: yes