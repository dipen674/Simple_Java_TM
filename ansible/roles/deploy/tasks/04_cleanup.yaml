# roles/deploy/tasks/04_cleanup.yaml
- name: Remove all unused Docker images
  shell: |
    # Remove all containers that are not running
    docker container prune -f
    
    # Remove all unused images (including dangling images)
    docker image prune -a -f
    
    # Remove all unused volumes
    docker volume prune -f
    
    # Remove all unused networks
    docker network prune -f
    
    # Perform a full system cleanup
    docker system prune -a -f
  args:
    executable: /bin/bash
  ignore_errors: yes

- name: Verify cleanup results
  shell: |
    echo "=== Remaining Images ==="
    docker images
    echo ""
    echo "=== Disk Usage ==="
    docker system df
  args:
    executable: /bin/bash
  register: cleanup_results

- name: Display cleanup results
  debug:
    var: cleanup_results.stdout_lines